  - when: {exploitation: active, automatable: "yes", technical_impact: partial, exposure: controlled}
    outcomes: {low: out_of_cycle, medium: out_of_cycle, high: immediate}
  - when: {exploitation: active, automatable: "yes", technical_impact: partial, exposure: open}
    outcomes: {low: immediate, medium: immediate, high: immediate}
  - when: {exploitation: active, automatable: "yes", technical_impact: total, exposure: local}
